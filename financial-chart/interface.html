<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>InitOption • Independent Canvas Chart</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c2c;color:#e8edf7;font:13px system-ui}header{padding:18px 22px;border-bottom:1px solid #30374c;display:flex;align-items:center;gap:16px;flex-wrap:wrap}strong{font-size:19px}small{color:#9faec6}#status{margin-left:auto;color:#ffce69}nav{display:flex;gap:10px;flex-wrap:wrap;padding:12px 22px;background:#1d2335}input,select,button{background:#293148;color:#e8edf7;border:1px solid #414c64;border-radius:5px;padding:9px;min-width:0}input{width:210px}button{cursor:pointer}button:hover{background:#3b4763}#chart{height:calc(100dvh - 205px);min-height:270px;position:relative}footer{padding:12px 22px;color:#a5b2ca;display:flex;gap:18px;flex-wrap:wrap}#notice{color:#ffce69}label{display:flex;align-items:center;gap:7px} @media(max-width:640px){header,nav{padding:10px;gap:7px}input{width:150px}#chart{height:55dvh}footer{padding:10px}}
</style>
<header><strong>InitOption <small>CANVAS ENGINE</small></strong><span id="notice">SIMULATION — NOT REAL MARKET DATA</span><span id="status" role="status">Disconnected</span></header>
<nav><label>Source <select id="mode"><option value="simulation">Simulation</option><option value="live">Live market</option></select></label><input id="url" aria-label="WebSocket URL" placeholder="wss://gateway/ticks"><input id="history" aria-label="Historical tick API URL" placeholder="https://gateway/history"><input id="symbol" aria-label="Symbol" value="DEMO/USD"><button id="connect">Connect</button><button id="disconnect">Disconnect</button></nav>
<nav><label>Type <select id="type"><option value="candles">Japanese candles</option><option value="heikinAshi">Heikin-Ashi</option><option value="area">Area</option><option value="bars">OHLC bars</option></select></label><label>Interval <select id="timeframe"></select></label><label><input id="sma" type="checkbox" style="width:auto">SMA 20</label><button id="fit">Fit chart</button><button id="draw">Draw trendline</button><button id="clear">Clear drawings</button></nav>
<div id="chart"></div><footer><span id="quote">Awaiting ticks</span><span>Drag to pan · Wheel/pinch to zoom · Crosshair to inspect</span><span id="depth"></span></footer>
<script>/* CHART_BUNDLE */</script></html>
