  <body>
    <div id="root"></div>
    <script>
      (() => {
        const BOOT_STATUS_KEY = "__INITOPTION_BOOT_STATUS__";
        const RECOVERY_ATTEMPT_KEY = "initoption:boot-recovery-attempts:v1";
        const MAX_RECOVERY_ATTEMPTS = 1;
        const BOOT_TIMEOUT_MS = 7000;
        const BOOT_ERROR_PATTERNS = [
          /Failed to fetch dynamically imported module/i,
          /Importing a module script failed/i,
          /ChunkLoadError/i,
          /Unable to preload CSS/i,
          /Loading chunk [\w-]+ failed/i,
        ];
        let recoveryTriggered = false;

        const getRoot = () => document.getElementById("root");
        const setBootStatus = (status) => {
          window[BOOT_STATUS_KEY] = status;
        };
        const getBootStatus = () => window[BOOT_STATUS_KEY];
        const rootHasMountedContent = () => {
          const root = getRoot();
          return Boolean(root && root.childElementCount > 0);
        };
        const readRecoveryAttempts = () => {
          try {
            return Number(window.sessionStorage.getItem(RECOVERY_ATTEMPT_KEY) || "0");
          } catch {
            return 0;
          }
        };
        const writeRecoveryAttempts = (value) => {
          try {
            window.sessionStorage.setItem(RECOVERY_ATTEMPT_KEY, String(value));
          } catch {
            // Ignore storage failures and keep the recovery best-effort.
          }
        };
        const clearRecoveryAttempts = () => {
          try {
            window.sessionStorage.removeItem(RECOVERY_ATTEMPT_KEY);
          } catch {
            // Ignore storage failures and continue.
          }
        };
        const normalizeErrorMessage = (value) => {
          if (!value) return "";
          if (typeof value === "string") return value;
          if (typeof value.message === "string") return value.message;
          try {
            return JSON.stringify(value);
          } catch {
            return String(value);
          }
        };
        const matchesBootFailure = (value) =>
          BOOT_ERROR_PATTERNS.some((pattern) => pattern.test(normalizeErrorMessage(value)));
        const renderRecoveryScreen = (message, details) => {
          const root = getRoot();
          if (!root) return;

          root.innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#141721;color:#edf2f7;font-family:Inter,system-ui,sans-serif;">
              <div style="width:min(100%,720px);border:1px solid rgba(255,255,255,0.08);background:linear-gradient(180deg,#1a1e2e 0%,#121722 100%);border-radius:20px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,0.32);">
                <div style="font-size:12px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:#ff9b5a;">Recovery mode</div>
                <h1 style="margin:14px 0 0;font-size:28px;line-height:1.2;">We hit a startup problem.</h1>
                <p style="margin:14px 0 0;color:#b6bfce;line-height:1.7;">${message}</p>
                ${
                  details
                    ? `<pre style="margin:18px 0 0;overflow:auto;border-radius:14px;background:rgba(0,0,0,0.28);padding:16px;font-size:12px;line-height:1.6;color:#ffb4b4;white-space:pre-wrap;">${details.replace(/[&<>]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[char]))}</pre>`
                    : ""
                }
                <div style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;">
                  <button id="boot-recovery-retry" style="border:0;border-radius:999px;padding:12px 18px;background:linear-gradient(180deg,#ff6200 0%,#df5200 100%);color:#fff;font-weight:800;cursor:pointer;">Try reload</button>
                  <button id="boot-recovery-reset" style="border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:12px 18px;background:#1b2232;color:#fff;font-weight:700;cursor:pointer;">Clear cached app data</button>
                </div>
              </div>
            </div>
          `;

          document.getElementById("boot-recovery-retry")?.addEventListener("click", () => {
            clearRecoveryAttempts();
            window.location.reload();
          });
          document.getElementById("boot-recovery-reset")?.addEventListener("click", async () => {
            try {
              const registrations = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistrations() : [];
              const cacheKeys = "caches" in window ? await caches.keys() : [];
              await Promise.all(registrations.map((registration) => registration.unregister().catch(() => false)));
              await Promise.all(cacheKeys.map((cacheKey) => caches.delete(cacheKey).catch(() => false)));
              clearRecoveryAttempts();
            } catch {
              // Ignore cleanup failures and still refresh.
            }

            window.location.reload();
          });
        };
        const recoverBoot = async (reason, error) => {
          if (recoveryTriggered) return;
          recoveryTriggered = true;

          const attempts = readRecoveryAttempts();
          if (attempts >= MAX_RECOVERY_ATTEMPTS) {
            renderRecoveryScreen(
              "The app could not finish loading automatically. Use the buttons below to retry or clear cached app data.",
              [reason, normalizeErrorMessage(error)].filter(Boolean).join("\n\n"),
            );
            return;
          }

          writeRecoveryAttempts(attempts + 1);

          try {
            const registrations = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistrations() : [];
            const cacheKeys = "caches" in window ? await caches.keys() : [];
            await Promise.all(registrations.map((registration) => registration.unregister().catch(() => false)));
            await Promise.all(cacheKeys.map((cacheKey) => caches.delete(cacheKey).catch(() => false)));
          } catch {
            // Continue to reload even if cleanup fails.
          }

          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set("__boot_recover", String(Date.now()));
          window.location.replace(nextUrl.toString());
        };

        setBootStatus("preboot");

        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            const resourceUrl =
              target instanceof HTMLScriptElement || target instanceof HTMLLinkElement
                ? target.src || target.href
                : "";

            if (resourceUrl || matchesBootFailure(event.error || event.message)) {
              void recoverBoot(resourceUrl ? `Failed to load resource: ${resourceUrl}` : "Startup error", event.error || event.message);
            }
          },
          true,
        );

        window.addEventListener("unhandledrejection", (event) => {
          if (matchesBootFailure(event.reason)) {
            void recoverBoot("Unhandled startup rejection", event.reason);
          }
        });

        window.setTimeout(() => {
          if (getBootStatus() === "mounted" || rootHasMountedContent()) {
            clearRecoveryAttempts();
            return;
          }

          void recoverBoot("Boot timeout", "The application did not mount within the expected startup window.");
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module">
      const LEGACY_BOOT_RESET_KEY = "initoption:legacy-boot-reset:v1";
      const DEV_HOSTNAMES = new Set(["localhost", "127.0.0.1"]);

      const shouldResetLegacyOfflineState = () =>
        typeof window !== "undefined" && !DEV_HOSTNAMES.has(window.location.hostname);

      const readLegacyResetFlag = () => {
        try {
          return window.sessionStorage.getItem(LEGACY_BOOT_RESET_KEY) === "1";
        } catch {
          return false;
        }
      };

      const writeLegacyResetFlag = () => {
        try {
          window.sessionStorage.setItem(LEGACY_BOOT_RESET_KEY, "1");
        } catch {
          // Ignore storage failures and rely on a single best-effort reload.
        }
      };

      const clearLegacyResetFlag = () => {
        try {
          window.sessionStorage.removeItem(LEGACY_BOOT_RESET_KEY);
        } catch {
          // Ignore storage failures and proceed with boot.
        }
      };

      const resetLegacyOfflineState = async () => {
        if (
          typeof window === "undefined" ||
          !shouldResetLegacyOfflineState() ||
          !("serviceWorker" in navigator)
        ) {
          return false;
        }

        const registrations = await navigator.serviceWorker.getRegistrations();
        const cacheKeys = "caches" in window ? await caches.keys() : [];
        const shouldReset = registrations.length > 0 || cacheKeys.length > 0;

        if (!shouldReset) {
          clearLegacyResetFlag();
          return false;
        }

        await Promise.all(
          registrations.map((registration) => registration.unregister().catch(() => false)),
        );
        await Promise.all(cacheKeys.map((cacheKey) => caches.delete(cacheKey).catch(() => false)));

        if (readLegacyResetFlag()) {
          return false;
        }

        writeLegacyResetFlag();
        window.location.reload();
        return true;
      };

      void (async () => {
        try {
          const reloadingAfterReset = await resetLegacyOfflineState();

          if (!reloadingAfterReset) {
            await import("/src/boot.ts");
          }
        } catch (error) {
          console.warn("Failed to reset legacy offline state before boot.", error);
          await import("/src/boot.ts");
        }
      })();
    </script>
